<!doctype html>
<html>
  <head>
    <title>Everybody Codes</title>
    <script type="text/javascript" src="everybodyCodes.js"></script>
    <script type="text/javascript" src="inputs.js"></script>
    <script type="text/javascript" src="answerFunctions.js"></script>
    <script type="text/javascript" src="../helpers.js"></script>
    <link rel="stylesheet" href="../styles.css" />
  </head>

  <body>
    <h2>Everybody Codes</h2>
    <div class="yearLinks">
      <a href="../2024/everybodyCodes.html">2024</a>
      <a href="../2025/everybodyCodes.html">2025</a>
      <a href="../2026/everybodyCodes.html">2026</a>
    </div>
    <div id="puzzles"></div>
  </body>

  <script>
    const numComplete = 1; // CHANGE THIS EVERY TIME WE ADD A QUEST

    let puzzleDiv = document.getElementById('puzzles');
    for (let day = 1; day <= numComplete; day++) {
      const puzzleDay = document.createElement('div');
      puzzleDay.classList.add('puzzle');
      puzzleDay.innerHTML = `
			<h4>DAY ${day}</h4>
			<button id="d${day}p1">Part 1</button>
			<button id="d${day}p2">Part 2</button>
      <button id="d${day}p3">Part 3</button>
			<p class="answer" id="d${day}p1-answer"></p>
			<p class="answer" id="d${day}p2-answer"></p>
      <p class="answer" id="d${day}p3-answer"></p>
		`;
      puzzleDiv.appendChild(puzzleDay);

      for (let part = 1; part <= 3; part++) {
        const id = `d${day}p${part}`;
        const button = document.getElementById(id);
        button.addEventListener('click', () => {
          const para = document.getElementById(`${id}-answer`);
          para.innerHTML = `Part ${part}: Calculating...`;

          // Allows 'Calculating...' to render to the DOM before starting calculation
          // https://stackoverflow.com/questions/16876394/dom-refresh-on-long-running-function
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              const calcAnswer = ANSWERS[`${day}-${part}`];
              console.time(`Day ${day}, Part ${part}`);
              const result = calcAnswer(INPUTS[`QUEST${day}_PART${part}`]);
              console.timeEnd(`Day ${day}, Part ${part}`);
              para.innerHTML = `Part ${part}: <b>${result}</b>`;
            });
          });
        });
      }
    }
  </script>
</html>
